# Full-stack development environment — brings up the entire project with one command:
#
#   docker compose up -d
#
# ── First-time setup ──────────────────────────────────────────────────────────
#
#  1. Copy and fill in secrets:
#       cp .env.example .env
#     Edit .env — at minimum set JWT_SECRET.
#
#  2. (Optional) VROOM: place your Linux x86-64 vroom binary at bin/vroom
#     before building. Without it, set SOLVER=greedy in .env (test-only solver)
#     or switch to ROUTING_PROVIDER=haversine which doesn't need VROOM.
#
#  3. Build the Flutter web app (skip if running flutter on the host):
#       cd Transport-System-Final/frontend
#       flutter build web \
#         --dart-define=API_BASE=http://localhost:8000 \
#         --dart-define=SCHEDULER_BASE=http://localhost:8080
#
#  4. (OSRM profile only) Pre-process your OSM data file:
#       # Download a .pbf for your region from https://download.geofabrik.de
#       cp ~/Downloads/region.osm.pbf osrm-data/
#       docker run --rm -v ./osrm-data:/data osrm/osrm-backend \
#           osrm-extract -p /opt/car.lua /data/region.osm.pbf
#       docker run --rm -v ./osrm-data:/data osrm/osrm-backend \
#           osrm-partition /data/region.osrm
#       docker run --rm -v ./osrm-data:/data osrm/osrm-backend \
#           osrm-customize /data/region.osrm
#     Then start everything: docker compose --profile osrm up -d
#     And set ROUTING_PROVIDER=osrm in .env.
#
# ─────────────────────────────────────────────────────────────────────────────

name: transit-full

services:

  # ── Shared Postgres ────────────────────────────────────────────────────────
  # Hosts two databases:
  #   transit  — Python / FastAPI backend (Alembic-managed)
  #   busdb    — Go scheduler service (schema.sql-managed)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transit}
      POSTGRES_DB: transit
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates transit_test (pytest) — from the main project
      - ./Transport-System-Final/backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10_test.sql:ro
      # Creates busdb for the scheduler service
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/20_busdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  # ── Python / FastAPI backend (main project) ────────────────────────────────
  api:
    build: ./Transport-System-Final/backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://transit:${POSTGRES_PASSWORD:-transit}@db:5432/transit
      TEST_DATABASE_URL: postgresql+asyncpg://transit:${POSTGRES_PASSWORD:-transit}@db:5432/transit_test
    ports:
      - "8000:8000"

  # ── Go bus-scheduler service ───────────────────────────────────────────────
  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://transit:${POSTGRES_PASSWORD:-transit}@db:5432/busdb?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — must match the Python API's JWT_SECRET}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-haversine}
      OSRM_URL: http://osrm:5000
      VROOM_PATH: /usr/local/bin/vroom
      SOLVER: ${SOLVER:-vroom}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
    ports:
      - "${SCHEDULER_PORT:-8080}:8080"

  # ── OSRM routing backend (optional profile) ────────────────────────────────
  # Enable: docker compose --profile osrm up -d
  # Requires pre-processed OSM data in osrm-data/ (see setup steps above).
  osrm:
    profiles: ["osrm"]
    image: osrm/osrm-backend:latest
    restart: unless-stopped
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/region.osrm
    ports:
      - "5000:5000"

volumes:
  pgdata:
