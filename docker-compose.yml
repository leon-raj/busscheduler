# Run the full stack locally:
#
#   docker compose up -d --build
#
# Both repos must be cloned into the same parent directory:
#
#   parent/
#   ├── busscheduler/           ← this repo
#   └── Transport-System-Final/ ← main project repo
#
# First-time setup:
#   cp .env.example .env        ← edit JWT_SECRET at minimum
#   cp /path/to/vroom bin/vroom ← optional; omit and set SOLVER=greedy without it
#
# Flutter web app (run separately on your machine, not in Docker):
#   cd ../Transport-System-Final/frontend
#   flutter run -d chrome \
#     --dart-define=API_BASE=http://localhost:8100 \
#     --dart-define=SCHEDULER_BASE=http://localhost:8080
#
# OSRM (optional, needs pre-processed map data):
#   docker compose --profile osrm up -d  (see README for data prep steps)

name: transit-full

services:

  # ── Shared Postgres ────────────────────────────────────────────────────────
  # Two databases in one instance:
  #   transit → Python API (Alembic-managed)
  #   busdb   → Go scheduler (schema.sql-managed)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transit}
      POSTGRES_DB: transit
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../Transport-System-Final/backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10_test.sql:ro,z
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/20_busdb.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  # ── Python / FastAPI backend ───────────────────────────────────────────────
  api:
    build: ../Transport-System-Final/backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://transit:${POSTGRES_PASSWORD:-transit}@db:5432/transit
      TEST_DATABASE_URL: postgresql+asyncpg://transit:${POSTGRES_PASSWORD:-transit}@db:5432/transit_test
    ports:
      - "8100:8000"

  # ── Go bus-scheduler service ───────────────────────────────────────────────
  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://transit:${POSTGRES_PASSWORD:-transit}@db:5432/busdb?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-haversine}
      OSRM_URL: http://osrm:5000
      VROOM_PATH: /usr/local/bin/vroom
      SOLVER: ${SOLVER:-vroom}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
    ports:
      - "${SCHEDULER_PORT:-8080}:8080"

  # ── OSRM (optional) ────────────────────────────────────────────────────────
  # Start with: docker compose --profile osrm up -d
  # Data prep:  see README — download an .osm.pbf and run the three extract/partition/customize steps
  osrm:
    profiles: ["osrm"]
    image: osrm/osrm-backend:latest
    restart: unless-stopped
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/region.osrm
    ports:
      - "5000:5000"

volumes:
  pgdata:
